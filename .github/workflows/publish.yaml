name: Publish to MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - 'server.json'
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate registry metadata
        run: mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        shell: bash
        env:
          MCP_PUBLISH_KEY: ${{ secrets.MCP_PUBLISH_KEY }}
          MCP_SERVER_DOMAIN: ${{ vars.MCP_SERVER_DOMAIN }}
        run: |
          : "${MCP_PUBLISH_KEY:?MCP_PUBLISH_KEY is required}"
          : "${MCP_SERVER_DOMAIN:?MCP_SERVER_DOMAIN is required}"
          umask 077
          key_path="$(mktemp "$RUNNER_TEMP/mcp-registry-key.XXXXXX")"
          trap 'rm -f "$key_path"' EXIT

          printf '%s' "$MCP_PUBLISH_KEY" | base64 --decode > "$key_path"
          private_key_hex="$(openssl pkey -in "$key_path" -text -noout | sed -n '/^priv:/,/^pub:/p' | sed '/^priv:/d; /^pub:/d' | tr -d ' :\n')"
          [[ "$private_key_hex" =~ ^[[:xdigit:]]{64}$ ]]
          printf '::add-mask::%s\n' "$private_key_hex"
          mcp-publisher login http --domain "$MCP_SERVER_DOMAIN" --private-key "$private_key_hex"

      - name: Publish server to MCP Registry
        run: mcp-publisher publish server.json
