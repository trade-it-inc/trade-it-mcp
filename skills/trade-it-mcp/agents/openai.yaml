interface:
  display_name: "Trade It"
  short_description: "Review brokerage accounts, holdings, and trades"
  icon_small: "./assets/trade-it-symbol-light.svg"
  icon_large: "./assets/trade-it-wordmark-light.svg"
  brand_color: "#EC2029"
  default_prompt: "Use $trade-it-mcp to show my connected brokerage accounts and holdings."

dependencies:
  tools:
    - type: "mcp"
      value: "tradeit"
      description: "Trade It brokerage MCP server"
      transport: "streamable_http"
      url: "https://mcp.tradeit.app/mcp"
